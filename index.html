<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"

    <meta name="author" content="Abdelrahman Ahmed">

    <title>Abdelrahman Ahmed | Data Engineer</title>

    <link

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .section-padding {
            padding: 90px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .section-subtitle {
            text-align: center;
            max-width: 650px;
            margin: 0 auto 50px;
            color: #64748b;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #e2e8f0;
        }

        .nav-container {
            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 1.2rem;
            font-weight: 800;

            color: #0f172a;
        }

        .logo-icon {
            background: #0f172a;
            color: #10b981;

            width: 38px;
            height: 38px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #475569;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #10b981;
        }

        .contact-btn {
            background: #0f172a;
            color: white;

            padding: 10px 18px;
            border-radius: 8px;

            font-weight: 600;

            transition: 0.3s;
        }

        .contact-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 90vh;

            display: grid;
            grid-template-columns: 1fr 1fr;

            align-items: center;
            gap: 60px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: #0f172a;
            color: #10b981;

            padding: 7px 15px;
            border-radius: 30px;

            font-size: 0.85rem;
            font-weight: 600;

            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            line-height: 1.05;

            color: #0f172a;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #10b981;
        }

        .hero h2 {
            font-size: 1.8rem;
            color: #1e3a5f;

            margin-bottom: 20px;
        }

        .hero p {
            color: #64748b;
            font-size: 1.05rem;

            max-width: 580px;

            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px 22px;
            border-radius: 8px;

            font-weight: 700;

            transition: 0.3s;
        }

        .btn-primary {
            background: #0f172a;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
        }

        .btn-secondary {
            border: 1px solid #cbd5e1;
            color: #0f172a;
            background: white;
        }

        .btn-secondary:hover {
            border-color: #0f172a;
            transform: translateY(-3px);
        }

        /* =========================
           DATA PIPELINE VISUAL
        ========================= */

        .pipeline-wrapper {
            position: relative;

            background: #0f172a;

            padding: 35px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.18);
        }

        .pipeline-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;

            margin-bottom: 25px;
        }

        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pipeline-node {
            background: #1e293b;

            border: 1px solid #334155;

            padding: 15px 18px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            gap: 15px;

            color: white;
        }

        .pipeline-node i {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #d1fae5;
            color: #059669;

            border-radius: 8px;
        }

        .pipeline-node small {
            display: block;
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .pipeline-node strong {
            font-size: 0.95rem;
        }

        .pipeline-arrow {
            text-align: center;
            color: #10b981;
        }

        .floating-badge {
            position: absolute;

            right: -25px;
            bottom: -25px;

            background: white;

            padding: 15px 20px;

            border-radius: 12px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .floating-badge span {
            display: block;

            font-size: 0.7rem;
            color: #94a3b8;

            text-transform: uppercase;
            font-weight: 700;
        }

        .floating-badge strong {
            color: #0f172a;
        }

        /* =========================
           SKILLS
        ========================= */

        .skills-section {
            background: white;
        }

        .skills-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 22px;
        }

        .skill-card {
            background: #f8fafc;

            padding: 25px;

            border-radius: 15px;

            border: 1px solid #e2e8f0;

            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 30px rgba(15, 23, 42, 0.07);
        }

        .skill-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #d1fae5;
            color: #059669;

            border-radius: 10px;

            margin-bottom: 15px;
        }

        .skill-card h3 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .skill-card p {
            color: #64748b;
            font-size: 0.92rem;
        }

        /* =========================
           PROJECTS
        ========================= */

        .projects-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 25px;
        }

        .project-card {
            background: white;

            padding: 28px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            display: flex;
            flex-direction: column;

            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 20px 40px rgba(15, 23, 42, 0.08);
        }

        .project-number {
            color: #10b981;
            font-weight: 800;
            font-size: 0.8rem;

            margin-bottom: 10px;
        }

        .project-title {
            font-size: 1.3rem;
            color: #0f172a;

            margin-bottom: 12px;
        }

        .project-desc {
            color: #64748b;
            font-size: 0.9rem;

            margin-bottom: 20px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-bottom: 25px;
        }

        .project-tag {
            background: #ecfdf5;
            color: #047857;

            padding: 5px 10px;

            border-radius: 5px;

            font-size: 0.75rem;
            font-weight: 700;
        }

        .project-link {
            margin-top: auto;

            color: #1e3a5f;

            font-weight: 700;

            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .project-link:hover {
            color: #10b981;
        }

        /* =========================
           EDUCATION
        ========================= */

        .education-section {
            background: white;
        }

        .education-list {
            max-width: 850px;
            margin: auto;

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .education-item {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;

            padding: 22px 25px;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            background: #f8fafc;
        }

        .education-info h4 {
            color: #0f172a;
            margin-bottom: 5px;
        }

        .education-info p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .education-year {
            background: #e2e8f0;

            color: #475569;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 0.8rem;
            font-weight: 700;

            white-space: nowrap;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact-section {
            text-align: center;
        }

        .contact-box {
            max-width: 750px;
            margin: auto;

            background: #0f172a;

            padding: 50px 30px;

            border-radius: 20px;
        }

        .contact-box h2 {
            color: white;
            font-size: 2rem;

            margin-bottom: 12px;
        }

        .contact-box p {
            color: #94a3b8;

            margin-bottom: 25px;
        }

        .social-links {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .social-link {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #1e293b;

            color: white;

            border-radius: 10px;

            transition: 0.3s;
        }

        .social-link:hover {
            background: #10b981;

            transform: translateY(-3px);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            color: #94a3b8;

            font-size: 0.85rem;

            border-top: 1px solid #e2e8f0;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .hero {
                grid-template-columns: 1fr;

                text-align: center;

                padding: 70px 0;
            }

            .hero p {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-buttons {
                justify-content: center;
            }

            .pipeline-wrapper {
                max-width: 600px;
                width: 100%;

                margin: auto;
            }

            .floating-badge {
                right: 10px;
            }

            .nav-links {
                display: none;
            }
        }

        @media (max-width: 600px) {

            .section-padding {
                padding: 65px 0;
            }

            .section-title {
                font-size: 2rem;
            }

            .hero h1 {
                font-size: 3rem;
            }

            .hero h2 {
                font-size: 1.4rem;
            }

            .pipeline-wrapper {
                padding: 22px;
            }

            .floating-badge {
                position: static;

                margin-top: 15px;

                text-align: center;
            }

            .education-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .contact-box {
                padding: 40px 20px;
            }
        }

    </style>

</head>
